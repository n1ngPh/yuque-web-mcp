name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:dependencies

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag yuque-web-mcp:ci .
      - name: Run non-root container smoke test
        shell: bash
        run: |
          set -euo pipefail
          smoke_env="$RUNNER_TEMP/yuque-web-mcp-ci.env"
          cleanup() {
            docker rm --force yuque-web-mcp-ci >/dev/null 2>&1 || true
            docker volume rm yuque-web-mcp-ci-data >/dev/null 2>&1 || true
            rm -f "$smoke_env"
          }
          trap cleanup EXIT
          umask 077
          printf '%s=%s\n' \
            YUQUE_HOST https://www.yuque.com \
            YUQUE_PERSONAL_HOST https://www.yuque.com \
            HOST 0.0.0.0 \
            PORT 3000 \
            PUBLIC_BASE_URL http://127.0.0.1:19090 \
            MCP_ALLOWED_HOSTS 127.0.0.1:19090 \
            MCP_OWNER_ID ci-owner \
            MCP_BEARER_TOKEN "$(openssl rand -hex 32)" \
            SESSION_ENCRYPTION_KEY "$(openssl rand -base64 32 | tr -d '\n')" \
            DATA_DIR /data \
            CONTRACT_PATH /app/contracts/yuque-web-2026-08-14.json \
            > "$smoke_env"
          docker volume create yuque-web-mcp-ci-data >/dev/null
          docker run --detach --name yuque-web-mcp-ci \
            --publish 127.0.0.1:19090:3000 \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --security-opt seccomp=deploy/chromium-seccomp.json \
            --init \
            --tmpfs /tmp:size=512m,mode=1777 \
            --shm-size 512m \
            --volume yuque-web-mcp-ci-data:/data \
            --env-file "$smoke_env" \
            yuque-web-mcp:ci >/dev/null
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:19090/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs yuque-web-mcp-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19090/healthz >/dev/null
          docker exec yuque-web-mcp-ci sh -eu -c \
            'test "$(id -u)" -ne 0 && test -w /data && test -f /data/state.db && ! command -v npm && ! command -v yarn'
          docker exec yuque-web-mcp-ci sh -eu -c \
            'chromium --headless --disable-gpu --dump-dom about:blank 2>/tmp/chromium.err | grep -q "<html"'
