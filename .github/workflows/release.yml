name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches the package version
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match $expected_tag" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run audit:dependencies
      - run: npm sbom --sbom-format cyclonedx --sbom-type application > yuque-web-mcp.cdx.json
      - uses: docker/setup-buildx-action@v3
      - name: Build image for release security scan
        run: docker build --tag yuque-web-mcp:release-scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: yuque-web-mcp:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          hide-progress: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: yuque-web-mcp.cdx.json
