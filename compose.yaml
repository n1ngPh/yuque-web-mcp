name: yuque-web-mcp

services:
  yuque-web-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: yuque-web-mcp:0.3.2
    restart: unless-stopped
    env_file:
      - /etc/yuque-web-mcp/service.env
    environment:
      DATA_DIR: /data
      CONTRACT_PATH: /app/contracts/yuque-web-2026-08-14.json
      CHROMIUM_EXECUTABLE: /usr/bin/chromium
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_BIND_PORT:-18080}:3000"
    volumes:
      - yuque-web-mcp-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    shm_size: 512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/healthz', { headers: { Host: '127.0.0.1:3000' } })
          .then(r => { if (!r.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  yuque-web-mcp-data:
